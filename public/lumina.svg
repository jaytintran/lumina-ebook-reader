<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="luminaEmerald" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="luminaGold" x1="24" y1="8" x2="24" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Subtle soft star glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean rounded icon container -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#luminaEmerald)" />

  <!-- Clean crisp open book pages -->
  <path 
    d="M12 33C16 31 20 31 24 33.5C28 31 32 31 36 33V18C32 16 28 16 24 18.5C20 16 16 16 12 18V33Z" 
    fill="#ffffff" 
    fill-opacity="0.22" 
    stroke="#ffffff" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  <path d="M24 18.5V33.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing warm gold star with NO stroke -->
  <path 
    d="M24 8.5L25.8 13.2L30.5 15L25.8 16.8L24 21.5L22.2 16.8L17.5 15L22.2 13.2L24 8.5Z" 
    fill="url(#luminaGold)" 
    filter="url(#softGlow)"
  />
</svg>
